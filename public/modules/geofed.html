<!doctype html>
<html lang="en-AU">
<head>
<script src="/config.js"></script><script src="/assets/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoFed · CDE Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#eef1f8; --panel:#ffffff; --panel2:#f7f8fc; --line:#e3e7f1; --line2:#d3d9e8;
  --text:#101528; --muted:#65708f; --faint:#98a1bd;
  --b1:#5b5cf0; --b2:#8b5cf6; --b3:#ec4899; --b4:#f59e0b; --b5:#06b6d4;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#3b82f6;
  --grad:linear-gradient(135deg,#5b5cf0 0%,#8b5cf6 45%,#ec4899 100%);
  --stripe:linear-gradient(90deg,#5b5cf0,#8b5cf6,#ec4899,#f59e0b,#10b981,#06b6d4);
  --top:#0f1430; --topText:#e8ebff;
  --shadow:0 1px 2px rgba(16,21,40,.06),0 6px 20px rgba(16,21,40,.07);
  --shadow2:0 12px 40px rgba(16,21,40,.18);
  --r:12px; --rs:8px;
  --viewerBg:#eef1f8;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#080c1c; --panel:#10162f; --panel2:#0c1228; --line:#1f2848; --line2:#2b3560;
  --text:#e7eaff; --muted:#9099c2; --faint:#5f6891;
  --top:#060918; --topText:#e8ebff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  --shadow2:0 12px 40px rgba(0,0,0,.6);
  --viewerBg:#0b1124;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--text);background:var(--bg);
  display:grid;grid-template-rows:auto 56px 1fr 30px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--b1)}
.hidden{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
#top{background:var(--top);color:var(--topText);display:flex;align-items:center;gap:14px;padding:0 14px;position:relative;z-index:20}
#top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stripe)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.65;letter-spacing:.3px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(139,92,246,.45)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;opacity:.9;font-size:12.5px}
.crumbs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.crumbs .sep{opacity:.4}
.spacer{flex:1}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:12px;opacity:.75}
.seg button:hover{opacity:1;background:rgba(255,255,255,.08)}
.seg button.on{background:#fff;color:#1b1f3b;opacity:1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tb{border:0;background:rgba(255,255,255,.08);color:inherit;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.tb:hover{background:rgba(255,255,255,.16)}
.tb.on{background:rgba(255,255,255,.22)}
.user{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:12px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- main grid ---------- */
#main{display:grid;grid-template-columns:var(--lw,350px) 1fr var(--rw,350px);min-height:0}
#main.noLeft{grid-template-columns:0 1fr var(--rw,350px)}
#main.noRight{grid-template-columns:var(--lw,350px) 1fr 0}
#main.noLeft.noRight{grid-template-columns:0 1fr 0}
.side{background:var(--panel);display:flex;min-height:0;min-width:0;overflow:hidden}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);flex-direction:column}
.rail{width:56px;flex:none;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail button{width:44px;border:0;background:transparent;border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:9.5px;font-weight:600;position:relative}
.rail button svg{width:18px;height:18px}
.rail button:hover{background:var(--line);color:var(--text)}
.rail button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(91,92,240,.35)}
.rail .dot{position:absolute;top:3px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.phead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.phead p{margin:4px 0 0;color:var(--muted);font-size:12px}
.pbody{flex:1;overflow:auto;padding:12px 14px 20px}
.pbody::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
.pbody::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--panel)}
.rtabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.rtabs button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
.rtabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.rtabs .cnt{background:var(--b1);color:#fff;border-radius:9px;padding:0 6px;font-size:10px}

/* ---------- form bits ---------- */
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.lbl:first-child{margin-top:2px}
.lbl .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.in,.sel{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:var(--rs);padding:8px 10px;outline:none}
.in:focus,.sel:focus{border-color:var(--b1);box-shadow:0 0 0 3px rgba(91,92,240,.15)}
.srch{position:relative}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint)}
.srch .in{padding-left:30px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:var(--rs);padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--b1);color:var(--b1)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 4px 14px rgba(91,92,240,.35)}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.block{width:100%;justify-content:center;padding:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ib{border:0;background:transparent;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ib:hover{background:var(--line);color:var(--text)}
.ib.on{color:var(--b1);background:rgba(91,92,240,.12)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--muted);user-select:none}
.chip:hover{border-color:var(--c,var(--b1));color:var(--text)}
.chip.on{background:var(--c,var(--b1));border-color:var(--c,var(--b1));color:#fff}
.chip .n{opacity:.7;font-weight:500}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--b1));display:inline-block}
.chip.on i{background:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.c{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.tag.ok{--c:var(--ok)} .tag.warn{--c:var(--warn)} .tag.bad{--c:var(--bad)} .tag.info{--c:var(--info)} .tag.vio{--c:var(--b2)}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:500}
.tog input{display:none}
.tog .sw2{width:32px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:.2s;flex:none}
.tog .sw2:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog input:checked+.sw2{background:var(--b1)}
.tog input:checked+.sw2:after{left:16px}
.segc{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.segc button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.segc button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.segc button.on.m{color:var(--b1)} .segc button.on.d{color:var(--b3)}
input[type=range]{width:100%;accent-color:var(--b1)}
.empty{text-align:center;color:var(--muted);padding:30px 14px}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:13.5px;margin-bottom:4px}
.note{background:color-mix(in srgb,var(--info) 9%,transparent);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);border-radius:var(--rs);padding:9px 11px;font-size:12px;color:var(--text);display:flex;gap:8px;line-height:1.45}
.note svg{color:var(--info);margin-top:1px}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note.warn svg{color:var(--warn)}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- project list & tree ---------- */
.plist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--rs);margin-top:6px}
.plist button{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 10px;cursor:pointer;gap:8px;align-items:center}
.plist button:last-child{border-bottom:0}
.plist button:hover{background:var(--panel2)}
.plist button.on{background:color-mix(in srgb,var(--b1) 10%,transparent);color:var(--b1);font-weight:700}
.tree{border:1px solid var(--line);border-radius:var(--rs);padding:4px 0;max-height:340px;overflow:auto}
.tn{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;margin:0 4px;cursor:default}
.tn:hover{background:var(--panel2)}
.tn .car{width:18px;height:18px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);border-radius:4px;flex:none;padding:0}
.tn .car svg{width:13px;height:13px;transition:transform .15s}
.tn .car.open svg{transform:rotate(90deg)}
.tn input[type=checkbox]{accent-color:var(--b1);margin:0 2px;flex:none}
.tn.dmode input[type=checkbox]{accent-color:var(--b3)}
.tn .fi{color:#f5b43c;flex:none}
.tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tn .bm,.tn .bd{font-size:9px;font-weight:800;border-radius:4px;padding:1px 4px;color:#fff}
.tn .bm{background:var(--b1)} .tn .bd{background:var(--b3)}
.tn .ld{font-size:10px;color:var(--faint)}

/* ---------- cards ---------- */
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,21,40,.04);position:relative;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card.sel{border-color:var(--b1);box-shadow:0 0 0 3px rgba(91,92,240,.14)}
.card.on:before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c,var(--b1))}
.card.dim{opacity:.5}
.card .name{font-weight:650;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.card .meta{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .chips{margin-top:7px;gap:4px}
.sw{width:12px;height:30px;border-radius:5px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.card .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 label,.grid3 label{font-size:10.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2 .in,.grid3 .in{padding:6px 8px;font-size:12px}
.nudge{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,22px);gap:2px}
.nudge button{border:1px solid var(--line2);background:var(--panel);border-radius:5px;font-size:11px;cursor:pointer;padding:0}
.nudge button:hover{border-color:var(--b1);color:var(--b1)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600}
.group-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:11.5px;margin:12px 0 6px;color:var(--muted)}
.group-h i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.group-h .n{margin-left:auto;font-weight:600;color:var(--faint)}

/* ---------- properties ---------- */
.pgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.pgroup summary{list-style:none;cursor:pointer;padding:8px 10px;font-weight:700;font-size:12px;background:var(--panel2);display:flex;align-items:center;gap:6px}
.pgroup summary::-webkit-details-marker{display:none}
.pgroup summary:before{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:.15s;margin-right:3px}
.pgroup[open] summary:before{transform:rotate(45deg)}
.pgroup summary .n{margin-left:auto;color:var(--faint);font-weight:600}
.ptable{width:100%;border-collapse:collapse;font-size:11.5px}
.ptable td{padding:5px 10px;border-top:1px solid var(--line);vertical-align:top}
.ptable td:first-child{color:var(--muted);width:44%;overflow-wrap:anywhere}
.ptable td:last-child{overflow-wrap:anywhere;font-weight:500}
.selhead{border-radius:12px;padding:12px;background:var(--grad);color:#fff;margin-bottom:10px;box-shadow:0 6px 18px rgba(91,92,240,.3)}
.selhead b{display:block;font-size:14px;overflow-wrap:anywhere}
.selhead span{font-size:11px;opacity:.85}

/* ---------- coverage ---------- */
.cov{border-collapse:separate;border-spacing:3px;font-size:11px;min-width:100%}
.cov th{font-weight:700;color:var(--muted);padding:4px;white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:1}
.cov th.rh{text-align:right;position:sticky;left:0;z-index:2}
.cov td{text-align:center;border-radius:6px;padding:6px 3px;cursor:pointer;min-width:30px;font-weight:700;border:1px solid transparent}
.cov td.z{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bad) 8%,transparent) 0 4px,transparent 4px 8px);color:var(--faint);border-color:color-mix(in srgb,var(--bad) 20%,transparent)}
.cov td:hover{border-color:var(--b1)}
.cov td small{display:block;font-weight:500;opacity:.8;font-size:9.5px}
.scroll{overflow:auto}

/* ---------- stage ---------- */
#stage{position:relative;display:flex;min-width:0;min-height:0;background:var(--bg);gap:0;overflow:hidden}
.view{position:relative;z-index:1;min-width:0;min-height:0;flex:1 1 0;overflow:hidden;background:var(--panel2)}
.view.wmin{display:none!important}
.view.float{position:absolute;z-index:40;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow2);resize:both;min-width:280px;min-height:200px;flex:none!important}
.view.float .wbar{cursor:move;border-radius:12px 12px 0 0}
.view.float .wbar .ib,.view.float .wbar select,.view.float .wbar a{cursor:pointer}
.wbar{position:absolute;left:0;right:0;top:0;height:36px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:8;user-select:none}
.wbar .wt{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.wbar .wt svg{width:14px;height:14px;color:var(--b1)}
.wctl{display:flex;gap:2px;flex:none}
.wctl .ib{width:26px;height:26px}
.wctl .ib svg{width:14px;height:14px}
.wbody{position:absolute;left:0;right:0;bottom:0;top:36px}
.dsplit{flex:0 0 6px;cursor:col-resize;background:var(--line);position:relative;z-index:2;transition:background .15s}
.dsplit:hover,.dsplit.drag{background:var(--b1)}
.dsplit:after{content:"";position:absolute;left:1px;right:1px;top:50%;height:28px;margin-top:-14px;border-left:1px solid var(--panel);border-right:1px solid var(--panel);opacity:.8}
#minDock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:60;display:flex;gap:6px;flex-wrap:wrap}
#minDock button{border:1px solid var(--line2);background:var(--panel);border-radius:18px;padding:6px 12px;font-weight:700;font-size:11.5px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
#minDock button:hover{border-color:var(--b1);color:var(--b1)}
#drawPane .wbar{position:relative;flex:none}
#drawPane{display:flex;flex-direction:column;background:var(--panel);min-width:0;position:relative}
#drawPane.ov{position:absolute;inset:46px 12px 12px 12px;z-index:6;border:2px solid var(--b3);border-radius:12px;box-shadow:var(--shadow2);overflow:hidden}
#drawPane.ov.click #viewer2d,#drawPane.ov.click #demo2d{pointer-events:none}
.hsplit{position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:30}
.hsplit:hover,.hsplit.drag{background:color-mix(in srgb,var(--b1) 45%,transparent)}
#left{position:relative}#right{position:relative}
.lpin{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.lpin b{display:flex;align-items:center;gap:6px;background:var(--c,#5b5cf0);color:#fff;border:2px solid #fff;border-radius:16px;padding:4px 10px 4px 8px;font:800 12px Inter,system-ui,sans-serif;white-space:nowrap}
.lpin b i{font-style:normal;background:rgba(255,255,255,.28);border-radius:9px;padding:0 6px;font-weight:700;font-size:10.5px}
.lpin:after{content:"";width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #fff;margin-top:-1px}
.lpin .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#5b5cf0);border:2px solid #fff;margin-top:1px}
.lpin.sel b{background:#111827;transform:scale(1.12)}
.lpin.dim{opacity:.45}

const Auth = {
  clientId: CDETK.clientId() || LS.get('clientId', ''),
  tok: CDETK.raw(),
  refreshing: null,
  get redirect() { return location.origin + location.pathname; },

  async login() {
    if (!this.clientId) throw new Error('Enter your APS Client ID first.');
    CDETK.setClientId(this.clientId);
    await CDETK.login(location.pathname); // the toolkit home page handles the callback, then returns here
  },
  async handleCallback() { return false; },
  async tokenRequest(body) {
    const r = await fetch(`${APS}/authentication/v2/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' }, body: new URLSearchParams(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.developerMessage || j.error || ('Token request failed (' + r.status + ')'));
    this.tok = { access: j.access_token, refresh: j.refresh_token || (this.tok && this.tok.refresh) || null, exp: Date.now() + ((j.expires_in || 3599) - 90) * 1000 };
    CDETK.save(this.tok);
  },
  async token() {
    if (!this.tok) throw new Error('Not signed in');
    if (Date.now() > this.tok.exp) {
      if (!this.tok.refresh) { this.logout(); throw new Error('Session expired. Please sign in again.'); }
      if (!this.refreshing) this.refreshing = this.tokenRequest({ grant_type: 'refresh_token', refresh_token: this.tok.refresh, client_id: this.clientId }).finally(() => { this.refreshing = null; });
      try { await this.refreshing; } catch (e) { this.logout(); throw new Error('Session expired. Please sign in again.'); }
    }
    return this.tok.access;
  },
  secondsLeft() { return this.tok ? Math.max(60, Math.round((this.tok.exp - Date.now()) / 1000)) : 60; },
  logout() { this.tok = null; CDETK.signOut(); }
};

/* =====================================================================
   API helpers
   ===================================================================== */
async function api(url, { method = 'GET', body, headers = {}, raw = false } = {}) {
  if (!/^https?:/.test(url)) url = APS + url;
  for (let attempt = 0; attempt < 4; attempt++) {
    const t = await Auth.token();
    const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + t, ...(body ? { 'Content-Type': 'application/json' } : {}), ...headers }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && attempt === 0 && Auth.tok && Auth.tok.refresh) { Auth.tok.exp = 0; continue; }
    if (r.status === 429 || r.status === 503) { await sleep(1200 * (attempt + 1)); continue; }
    if (!r.ok) {
      let msg = '';
      try { const j = await r.json(); msg = j.detail || j.developerMessage || (j.errors && j.errors[0] && (j.errors[0].detail || j.errors[0].title)) || j.message || j.reason || ''; } catch (e) { }
      const err = new Error(`${r.status}${msg ? ' – ' + msg : ' ' + r.statusText}`); err.status = r.status; throw err;
    }
    if (raw) return r;
    if (r.status === 204) return null;
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  }
  throw new Error('The server is busy. Please try again shortly.');
}
async function apiAll(url) {
  const data = [], included = [];
  while (url) {
    const j = await api(url);
    if (j && j.data) data.push(...j.data);
    if (j && j.included) included.push(...j.included);
    const n = j && j.links && j.links.next; url = typeof n === 'string' ? n : (n && n.href) || null;
  }
  return { data, included };
}
function versionInfo(v) {
  const a = (v && v.attributes) || {};
  const der = v && v.relationships && v.relationships.derivatives;
  const href = (der && der.meta && der.meta.link && der.meta.link.href) || '';
  const derivUrn = (der && der.data && der.data.id) || (v && v.id ? b64urlStr(v.id) : null);
  const mdBase = href && href.includes('/designdata/') ? href.split('/designdata/')[0] : APS + '/modelderivative/v2';
  return {
    versionId: v && v.id, versionNumber: a.versionNumber, lastModified: a.lastModifiedTime || a.createTime,
    modifiedBy: a.lastModifiedUserName || a.createUserName || '', derivUrn, mdBase,
    manifestUrl: href || (derivUrn ? `${mdBase}/designdata/${derivUrn}/manifest` : null),
    vtype: (a.extension && a.extension.type) || ''
  };
}
function fileFrom(item, v, folder) {
  const ia = item.attributes || {}, va = (v && v.attributes) || {};
  const name = ia.displayName || va.displayName || va.name || 'Unnamed';
  let ext = (va.fileType || '').toLowerCase();
  if (!ext) { const m = name.match(/\.([a-z0-9]+)$/i); ext = m ? m[1].toLowerCase() : ''; }
  return {
    id: item.id, name, ext, folderId: folder.id, folderPath: folder.path,
    webView: (item.links && item.links.webView && item.links.webView.href) || (v && v.links && v.links.webView && v.links.webView.href) || '',
    ...versionInfo(v), attrs: {}, approval: '', title: '', revision: null, translation: 'unknown', progress: ''
  };
}

function mdRegionHeader() {

  if (!r || r === 'US') return {};
  return { region: r === 'APAC' ? 'AUS' : r };
}

  async projects(hub) { const r = await apiAll(`/project/v1/hubs/${encodeURIComponent(hub.id)}/projects?page[limit]=100`); return r.data.map(p => ({ id: p.id, name: p.attributes.name })).sort((a, b) => a.name.localeCompare(b.name)); },
  async topFolders(hub, project) {
    const r = await apiAll(`/project/v1/hubs/${encodeURIComponent(hub.id)}/projects/${encodeURIComponent(project.id)}/topFolders?excludeDeleted=true`);
    return r.data.filter(f => !f.attributes.hidden).map(f => ({ id: f.id, name: f.attributes.displayName || f.attributes.name }));
  },
  async contents(project, folder) {
    const r = await apiAll(`/data/v1/projects/${encodeURIComponent(project.id)}/folders/${encodeURIComponent(folder.id)}/contents?page[limit]=200`);
    const byId = new Map(r.included.map(x => [x.id, x]));
    const folders = [], items = [];
    for (const d of r.data) {
      if (d.type === 'folders') { if (!d.attributes.hidden) folders.push({ id: d.id, name: d.attributes.displayName || d.attributes.name }); }
      else if (d.type === 'items') {
        if (d.attributes && d.attributes.hidden) continue;
        const tip = d.relationships && d.relationships.tip && d.relationships.tip.data && d.relationships.tip.data.id;
        items.push(fileFrom(d, byId.get(tip), folder));
      }
    }
    return { folders, items };
  },
  async attributes(project, versionIds, onProgress) {
    const out = new Map(); const chunks = [];
    for (let i = 0; i < versionIds.length; i += 50) chunks.push(versionIds.slice(i, i + 50));
    let done = 0;
    await pool(chunks, 3, async c => {
      const j = await api(`/bim360/docs/v1/projects/${noB(project.id)}/versions:batch-get`, { method: 'POST', body: { urns: c } });
      for (const r of (j && j.results) || []) {
        const attrs = {}; for (const a of r.customAttributes || []) if (a && a.name) attrs[a.name] = a.value == null ? '' : String(a.value);
        out.set(r.urn, { attrs, approval: (r.approvalStatus && (r.approvalStatus.label || r.approvalStatus.value)) || '', approvalValue: (r.approvalStatus && r.approvalStatus.value) || '', title: r.title || '', revision: r.revisionNumber ?? null });
      }

  },
  async versions(project, file) {

    return r.data.map(v => versionInfo(v)).sort((a, b) => (b.versionNumber || 0) - (a.versionNumber || 0));
  },
  async manifest(file) {
    // Try the link Data Management gives us, then the plain endpoint with the hub's region header (needed for AUS / EMEA data).
    const plain = `${APS}/modelderivative/v2/designdata/${file.derivUrn}/manifest`;
    const tries = [[file.manifestUrl, {}], [plain, mdRegionHeader()], [file.manifestUrl, mdRegionHeader()]].filter(([u]) => u);
    let last = null;
    for (const [u, h] of tries) {
      try { const m = await api(u, { headers: h }); return { status: m.status, progress: m.progress || '' }; }
      catch (e) { last = e; if (e.status !== 403 && e.status !== 404 && e.status !== 400) break; }

    return { status: 'error', message: errMsg(last) };
  },

      docs: (i.linkedDocuments || []).map(d => ({ urn: d.urn, type: d.type, pos: (d.details && d.details.position) || null }))

/* ---------------- scan / federate ---------------- */
async function scan() {
  if (!S.project) return;
  savePick();
  if (S.loaded.size) Viewer.unloadAll();
  Busy.set('Scanning folders…', 3);
  const seen = new Map(); let folders = 0;
  try {
    for (const role of ['model', 'drawing']) {
      const queue = [...S.pick[role]].map(id => S.tree.get(id)).filter(Boolean).map(n => ({ id: n.id, path: n.path }));
      const visited = new Set();
      while (queue.length) {
        const batch = queue.splice(0, 6).filter(f => !visited.has(f.id));
        batch.forEach(f => visited.add(f.id));
        await pool(batch, 6, async f => {
          if (!S.tree.has(f.id)) S.tree.set(f.id, { id: f.id, name: f.path.split(' / ').pop(), path: f.path, children: null, open: false });
          const c = await getContents(f); folders++;
          for (const it of c.items) { const e = seen.get(it.id) || { file: it, roles: new Set() }; e.roles.add(role); seen.set(it.id, e); }
          if (S.recursive) for (const sf of c.folders) queue.push({ id: sf.id, path: f.path + ' / ' + sf.name });
          Busy.set(`Scanning… ${folders} folders, ${seen.size} files`, 5 + Math.min(45, folders * 2));
        });
      }
    }
    const files = [];
    for (const { file, roles } of seen.values()) {
      const kind = (roles.has('model') && S.modelTypes.has(file.ext)) ? 'model' : (roles.has('drawing') && S.drawTypes.has(file.ext)) ? 'drawing' : (S.includeDocs ? 'document' : null);
      if (kind) files.push({ ...file, kind });
    }
    Busy.set(`Reading attributes for ${files.length} files…`, 55);
    const ids = files.map(f => f.versionId).filter(Boolean);
    const attrs = await Data.attributes(S.project, ids, (d, t) => Busy.set(`Reading attributes… ${d}/${t}`, 55 + 40 * d / Math.max(1, t)));
    for (const f of files) { const a = attrs.get(f.versionId); if (a) Object.assign(f, { attrs: a.attrs, approval: a.approval, approvalValue: a.approvalValue, title: a.title, revision: a.revision }); }
    S.files = files.sort((a, b) => a.name.localeCompare(b.name)); S.byId = new Map(files.map(f => [f.id, f])); S.scanned = true;
    detectAttrs(); resetFilters(false);
    Busy.done();
    toast(`Found ${models().length} models, ${drawings().length} drawings and ${S.files.filter(f => f.kind === 'document').length} other documents in ${folders} folders.`, 'ok');
    if (!files.length) toast('No matching files. Check the ticked folders and file types.', 'warn', 6000);
    S.ltab = 'models'; refreshAll(false);
    checkManifests(models());
  } catch (e) { Busy.done(); toast('Scan failed: ' + errMsg(e), 'bad', 8000); console.error(e); }
}
async function checkManifests(list) {
  await pool(list, 4, async f => {
    const m = await Data.manifest(f); f.translation = m.status; f.progress = m.progress || '';
    if (S.ltab === 'models' || S.ltab === 'qa') { scheduleRender(); }
  });
  scheduleRender();
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(() => { S.__keepScroll = true; renderLeft(); }, 150); }

function detectAttrs() {
  const names = new Map(); for (const f of S.files) for (const k of Object.keys(f.attrs)) names.set(k, (names.get(k) || 0) + 1);
  S.attrNames = [...names.keys()].sort((a, b) => a.localeCompare(b));
  const saved = LS.get('attrMap.' + S.project.id, {});
  const find = (re) => S.attrNames.find(n => re.test(n) && /code/i.test(n)) || S.attrNames.find(n => re.test(n)) || null;
  S.locAttr = saved.loc && names.has(saved.loc) ? saved.loc : find(/location/i);
  S.discAttr = saved.disc && names.has(saved.disc) ? saved.disc : find(/discipline/i);
  computeColours();
}
function computeColours() {
  const vals = [...new Set(S.files.map(f => val(f, S.discAttr)))].filter(v => v !== BLANK).sort();
  S.colours = new Map(vals.map((v, i) => [v, PALETTE[i % PALETTE.length]])); S.colours.set(BLANK, BLANK_COLOUR);
}
function resetFilters(render = true) {

function chipList(attr, key, setGetter, coloured) {
  const counts = new Map();
  for (const f of models()) if (passes(f, key)) { const v = val(f, attr); counts.set(v, (counts.get(v) || 0) + 1); }
  for (const f of models()) { const v = val(f, attr); if (!counts.has(v)) counts.set(v, 0); }
  const set = setGetter();
  const keys = [...counts.keys()].sort((a, b) => a === BLANK ? 1 : b === BLANK ? -1 : a.localeCompare(b, undefined, { numeric: true }));
  if (!keys.length) return '<div class="empty" style="padding:6px;text-align:left">No values</div>';
  return `<div class="chips">${keys.map(v => `<span class="chip ${set.has(v) ? 'on' : ''}" style="--c:${coloured ? colourOfDisc(v) : 'var(--b1)'}" data-act="fchip" data-key="${esc(key)}" data-v="${esc(v)}">${coloured ? '<i></i>' : ''}${esc(v)}<span class="n">${counts.get(v)}</span></span>`).join('')}</div>`;
}

// splitter drag between docked views

  focus: el => Viewer.focus(el.dataset.id),

  nudge: el => { const e = S.loaded.get(el.dataset.id); if (!e) return; const st = +S.nudgeStep || 1; const p = e.place; if (el.dataset.dr) return Viewer.setPlace(el.dataset.id, { rot: Math.round(((+p.rot || 0) + st) * 100) / 100 }); const en = Geo.toENU(p.lat, p.lon); const ll = Geo.toLL(en.e + (+el.dataset.dx) * st, en.n + (+el.dataset.dy) * st); Viewer.setPlace(el.dataset.id, { lat: ll.lat, lon: ll.lon }); },
  pickPlace: el => { const id = el.dataset.id; MapUI.startPick('Click the map where this model’s reference point should sit', ll => Viewer.setPlace(id, { lat: ll.lat, lon: ll.lng })); },

  setProjLoc: () => MapUI.startPick('Click the project location on the map', ll => { LS.set('projLocManual.' + S.project.id, { lat: ll.lat, lon: ll.lng }); Viewer.replaceAll(); MapUI.fitModels(); Viewer.fitAll(); S.__keepScroll = true; renderLeft(); toast('Project location set', 'ok'); }),
  clearProjLoc: () => { LS.set('projLocManual.' + S.project.id, null); Viewer.replaceAll(); MapUI.fitModels(); Viewer.fitAll(); S.__keepScroll = true; renderLeft(); },
  cancelPick: () => MapUI.endPick(),
  fchip: el => { const k = el.dataset.key, v = el.dataset.v; const set = k === 'loc' ? S.filters.loc : k === 'disc' ? S.filters.disc : k === 'types' ? S.filters.types : (S.filters.other[k] = S.filters.other[k] || new Set()); set.has(v) ? set.delete(v) : set.add(v); applyFilters(); },

  applyView: el => applyView(el.dataset.id),

  signIn: async () => { const id = ($('#gClient') && $('#gClient').value.trim()) || Auth.clientId; Auth.clientId = id; LS.set('clientId', id); try { await Auth.login(); } catch (e) { showGate(errMsg(e)); } },
  demo: () => { location.href = Auth.redirect + '?demo=1'; },
  copyCb: () => { navigator.clipboard && navigator.clipboard.writeText(CDETK.redirect).then(() => toast('Callback URL copied', 'ok')).catch(() => { }); },

const IN = {
  hub: { change: el => selectHub(el.value) },
  projSearch: { input: el => { S.projSearch = el.value; renderLeft(); } },
  recursive: { change: el => { S.recursive = el.checked; if (S.project) savePick(); } },
  includeDocs: { change: el => { S.includeDocs = el.checked; LS.set('includeDocs', S.includeDocs); } },
  locSearch: { input: el => { S.locSearch = el.value; renderLeft(); } },
  locItemSearch: { input: el => { S.locItemSearch = el.value; renderLeft(); } },
  pickFolder: { change: el => { const set = S.pick[S.pickMode]; el.checked ? set.add(el.dataset.id) : set.delete(el.dataset.id); savePick(); S.__keepScroll = true; renderLeft(); } },
  text: { input: el => { clearTimeout(IN._t); IN._t = setTimeout(() => { S.filters.text = el.value.trim().toLowerCase(); applyFilters(); }, 220); } },
  locAttr: { change: el => { S.locAttr = el.value || null; LS.set('attrMap.' + S.project.id, { loc: S.locAttr, disc: S.discAttr }); S.filters.loc = new Set(); applyFilters(); } },
  discAttr: { change: el => { S.discAttr = el.value || null; LS.set('attrMap.' + S.project.id, { loc: S.locAttr, disc: S.discAttr }); S.filters.disc = new Set(); computeColours(); applyFilters(); Viewer.applyColours(); } },
  version: { change: async el => { const f = S.byId.get(el.dataset.id); const v = (S.versionsCache.get(f.id) || []).find(x => x.versionId === el.value); if (!v) return; const wasLoaded = S.loaded.has(f.id); if (wasLoaded) Viewer.unload(f.id); Object.assign(f, { versionId: v.versionId, versionNumber: v.versionNumber, lastModified: v.lastModified, modifiedBy: v.modifiedBy, derivUrn: v.derivUrn, mdBase: v.mdBase, manifestUrl: v.manifestUrl, translation: 'unknown' }); try { const a = (await Data.attributes(S.project, [v.versionId])).get(v.versionId); if (a) Object.assign(f, { attrs: a.attrs, approval: a.approval, approvalValue: a.approvalValue }); } catch (e) { } await checkManifests([f]); if (wasLoaded) await Viewer.load(f); toast(`Switched to V${v.versionNumber}`, 'ok'); S.__keepScroll = true; renderLeft(); } },
  place: { change: el => { const n = parseFloat(el.value); if (!isFinite(n)) return toast('Enter a number', 'warn'); Viewer.setPlace(el.dataset.id, { [el.dataset.k]: n }); } },
  nudgeStep: { change: el => { S.nudgeStep = parseFloat(el.value) || 1; } },
  mgaZone: { change: el => { LS.set('mgaZone', el.value); Viewer.replaceAll(); MapUI.fitModels(); Viewer.fitAll(); S.__keepScroll = true; renderLeft(); } },
  georefMaxKm: { change: el => { const v = parseFloat(el.value); if (!(v > 0)) return toast('Enter a distance in km', 'warn'); LS.set('georefMaxKm', v); Viewer.replaceAll(); MapUI.fitModels(); Viewer.fitAll(); S.__keepScroll = true; renderLeft(); } },
  importViews: { change: el => { const file = el.files[0]; if (!file) return; file.text().then(t => { const arr = JSON.parse(t); if (!Array.isArray(arr)) throw new Error('Not a views file'); const cur = LS.get(viewsKey(), []); const ids = new Set(cur.map(v => v.id)); LS.set(viewsKey(), [...arr.filter(v => v && v.id && !ids.has(v.id)), ...cur]); toast(`Imported ${arr.length} view(s)`, 'ok'); renderLeft(); }).catch(e => toast('Import failed: ' + errMsg(e), 'bad')); } },
  propSearch: { input: el => { S.propSearch = el.value; renderRight(); } },
  drawSearch: { input: el => { S.drawSearch = el.value; renderRight(); } },
  groundOn: { change: el => { Viewer.opts.ground.on = el.checked; if (DEMO) toast('The 3D ground map appears in the 3D viewer after sign-in.', 'info'); Viewer.updateGround(); renderVTools(); } },
  ground: { input: el => { Viewer.opts.ground[el.dataset.k] = parseFloat(el.value); const r = el.previousElementSibling && el.previousElementSibling.querySelector('.r'); if (r) r.textContent = el.dataset.k === 'opacity' ? Math.round(el.value * 100) + '%' : el.value + ' m'; Viewer.updateGroundSoon(); } },
  explode: { input: el => Viewer.explode(parseFloat(el.value)) },
  drawOpacity: { input: el => { Draw.opacity = parseFloat(el.value); $('#drawPane').style.opacity = Draw.opacity; } },

  drawSheet: { change: el => Draw.loadSheet(+el.value).catch(e => toast(errMsg(e), 'bad')) },

  drape: { input: el => { const d = MapUI.drapes.find(x => x.id === MapUI.activeDrape); if (!d) return; d[el.dataset.k] = parseFloat(el.value); const lab = { width: ['#dwv', Math.round(d.width) + ' m'], rot: ['#drv', d.rot + '°'], opacity: ['#dov', Math.round(d.opacity * 100) + '%'] }[el.dataset.k]; $(lab[0]).textContent = lab[1]; if (el.dataset.k === 'opacity' && d.layer) d.layer.setOpacity(d.opacity); else { cancelAnimationFrame(IN._raf); IN._raf = requestAnimationFrame(() => MapUI.renderDrape(d)); } } },
  drapeKnock: { change: el => { const d = MapUI.drapes.find(x => x.id === MapUI.activeDrape); if (d) { d.knock = el.checked; MapUI.renderDrape(d); } } },
  pinsOn: { change: el => { Viewer.opts.pins = el.checked; Viewer.updatePins(); renderVTools(); } },
  gClient: { input: el => { Auth.clientId = el.value.trim(); LS.set('clientId', Auth.clientId); } }
};
Object.assign(ACT, ACT5); Object.assign(IN, IN5);
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
  if (el.tagName === 'SPAN' && el.classList.contains('nm')) ev.preventDefault();
  try { const r = fn(el, ev); if (r && r.catch) r.catch(e => { console.error(e); toast(errMsg(e), 'bad'); }); } catch (e) { console.error(e); toast(errMsg(e), 'bad'); }
});
for (const type of ['input', 'change']) document.addEventListener(type, ev => {
  const el = ev.target.closest && ev.target.closest('[data-in]'); if (!el) return;
  const h = IN[el.dataset.in]; if (!h || !h[type]) return;
  try { const r = h[type](el, ev); if (r && r.catch) r.catch(e => toast(errMsg(e), 'bad')); } catch (e) { console.error(e); toast(errMsg(e), 'bad'); }
});
// keep focus/caret when panes re-render while typing
for (const fnName of ['renderLeft', 'renderRight']) {
  const orig = window[fnName];
  window[fnName] = function () {
    const a = document.activeElement; const key = a && a.dataset && a.dataset.in; const pos = key && a.selectionStart;
    orig.apply(this, arguments);
    if (key && (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'range')) {
      const n = document.querySelector(`[data-in="${key}"]${a.dataset.id ? `[data-id="${CSS.escape(a.dataset.id)}"]` : ''}${a.dataset.k ? `[data-k="${a.dataset.k}"]` : ''}`);
      if (n && n !== a) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
    }
  };
}
$('#layoutSeg').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setLayout(b.dataset.layout); });
$('#btnTheme').onclick = () => setTheme(S.theme === 'dark' ? 'light' : 'dark');
$('#btnLeft').onclick = () => { $('#main').classList.toggle('noLeft'); afterResize(); };
$('#btnRight').onclick = () => { $('#main').classList.toggle('noRight'); afterResize(); };
$('#btnOut').onclick = () => { if (DEMO) { CDETK.setDemo(false); location.href = '/app/'; return; } Auth.logout(); location.href = Auth.redirect; };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#modalHost').innerHTML) $('#modalHost').innerHTML = ''; else if (MapUI.pick) MapUI.endPick(); else if (Viewer.pop) { Viewer.pop = null; renderVTools(); } } });
window.addEventListener('resize', () => afterResize());

/* =====================================================================
   GATE (sign-in / setup)
   ===================================================================== */
function showGate(error) {
  const g = $('#gate'); g.classList.remove('hidden');
  const fileProto = location.protocol === 'file:';
  g.innerHTML = `<div class="gbox">
    <div class="ghero">
      <div class="brand"><div class="logo">${$('.logo').innerHTML}</div><div>GeoFed<small>ACC federated GIS viewer</small></div></div>
      <h1>Your ACC models,<br><em>federated on the map.</em></h1>
      <p>Pick a project and folders in Autodesk Construction Cloud, filter by location and discipline codes, inspect properties, and open the matching drawings beside, over or under the model.</p>
      <div class="feat">
        <div style="--c:#818cf8"><i></i>Map + 3D federation</div><div style="--c:#f472b6"><i></i>Location & discipline filters</div>
        <div style="--c:#22d3ee"><i></i>Object properties</div><div style="--c:#fbbf24"><i></i>Drawings side-by-side & overlay</div>
        <div style="--c:#34d399"><i></i>Coverage matrix & QA</div><div style="--c:#c084fc"><i></i>Saved views & snapshots</div>
      </div>
    </div>
    <div class="gcard">
      <h3>Connect to Autodesk</h3>
      <p class="muted">Sign in with your own Autodesk account. You only see the ACC projects and files you already have access to.</p>
      ${error ? `<div class="gerr">${esc(error)}</div>` : ''}
      ${fileProto ? `<div class="gerr">This page is open from a file on your computer. Sign-in needs a web address, so host it first (for example on Netlify) and open that link.</div>` : ''}
      <label class="lbl" style="color:#65708f">APS Client ID</label>
      <input class="in" id="gClient" data-in="gClient" placeholder="Paste your APS app Client ID" value="${esc(Auth.clientId)}">
      <label class="lbl" style="color:#65708f">Callback URL to register in your APS app</label>
      <div class="cbu"><span>${esc(CDETK.redirect)}</span><button class="ib" data-act="copyCb" title="Copy">${ic('copy')}</button></div>
      <div class="row" style="margin-top:14px"><button class="btn pri grow" style="justify-content:center;padding:10px" data-act="signIn" ${fileProto ? 'disabled' : ''}>Sign in with Autodesk</button><button class="btn" data-act="demo" style="padding:10px">Try demo</button></div>
      <ol class="steps">
        <li><span>In the APS developer portal, create an app of type <b>Desktop, Mobile, Single-Page App</b> (no client secret).</span></li>
        <li><span>Add the callback URL above, and enable the Data Management, Model Derivative, Viewer and ACC APIs.</span></li>
        <li><span>Ask your ACC account admin to add the Client ID under <b>Account Admin › Custom Integrations</b>.</span></li>
      </ol>
      ${Auth.clientId ? `<p style="margin:10px 0 0;font-size:11px"><a href="#" data-act="resetClient">Forget saved Client ID</a></p>` : ''}
    </div></div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  document.documentElement.dataset.theme = S.theme;
  renderTop(); setLayout(S.layout); MapUI.init(); renderVTools(); renderBlank();
  if (!DEMO) {
    try { await Auth.handleCallback(); } catch (e) { showGate(errMsg(e)); return; }
    if (!Auth.signedIn) { showGate(); return; }
  }
  refreshAll(false);
  Data.user().then(u => { S.user = u; renderTop(); });
  try { S.hubs = await Data.hubs(); }
  catch (e) {
    if (/sign in/i.test(errMsg(e)) || e.status === 401) { Auth.logout(); showGate('Your session has expired. Please sign in again.'); return; }
    toast('Could not list ACC hubs: ' + errMsg(e), 'bad', 9000);
  }
  if (!S.hubs.length) { toast('No ACC hubs found. Ask your ACC account admin to add this app under Custom Integrations.', 'warn', 12000); renderLeft(); return; }
  const last = LS.get('lastHub', null);
  await selectHub(S.hubs.some(h => h.id === last) ? last : S.hubs[0].id);
  if (DEMO) toast('Demo mode: sample data, no Autodesk connection.', 'info', 6000);
}
boot();
